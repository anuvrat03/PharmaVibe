<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaVibe - Daily Pharma Intelligence</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- Header / Brand Banner -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <h1 class="text-2xl font-extrabold text-blue-600 tracking-tight flex items-center gap-1">
                <span>Pharma<span class="text-rose-500">Vibe</span></span>
            </h1>
            <div class="text-xs text-slate-500 text-right">
                <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse mr-1"></span>
                <span id="update-timestamp">Live Intelligence</span>
            </div>
        </div>
    </header>

    <!-- Stock Market Watch Ticker -->
    <section class="bg-slate-900 text-white border-b border-slate-800">
        <div class="max-w-7xl mx-auto flex items-center px-4 py-2">
            <span class="text-xs font-bold uppercase tracking-wider text-slate-400 mr-4 shrink-0">Market Watch</span>
            <div id="stock-container" class="flex items-center gap-4 overflow-x-auto no-scrollbar whitespace-nowrap text-xs font-medium py-1">
                <span class="text-slate-500">Loading live stock data...</span>
            </div>
        </div>
    </section>

    <!-- Main Dashboard Container -->
    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- Category Filter Pills -->
        <nav class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-4 mb-6" id="category-filters">
            <button onclick="filterCategory('All Feeds')" class="filter-btn active bg-blue-600 text-white px-4 py-2 rounded-full text-xs font-semibold shrink-0 shadow-sm transition">All Feeds</button>
            <button onclick="filterCategory('FDA & Approvals')" class="filter-btn bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 px-4 py-2 rounded-full text-xs font-semibold shrink-0 transition">FDA & Approvals</button>
            <button onclick="filterCategory('M&A & Financials')" class="filter-btn bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 px-4 py-2 rounded-full text-xs font-semibold shrink-0 transition">M&A & Financials</button>
            <button onclick="filterCategory('Clinical & Drugs')" class="filter-btn bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 px-4 py-2 rounded-full text-xs font-semibold shrink-0 transition">Clinical & Drugs</button>
            <button onclick="filterCategory('Industry General')" class="filter-btn bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 px-4 py-2 rounded-full text-xs font-semibold shrink-0 transition">Industry General</button>
        </nav>

        <!-- News Feed Grid -->
        <section id="feed-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6">
            <div class="col-span-full text-center py-12 text-slate-400 font-medium">Loading latest intelligence...</div>
        </section>

    </main>

    <!-- JavaScript Data Handler -->
    <script>
        let allArticles = [];
        let currentActiveCategory = 'All Feeds';

        async function loadDashboardData() {
            try {
                // Fetch cached static JSON generated by GitHub Actions
                const response = await fetch('./data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Failed to load data.json');
                
                const data = await response.json();

                // Update Header Timestamp
                if (data.updated || data.last_updated) {
                    document.getElementById('update-timestamp').innerText = 'Updated: ' + (data.updated || data.last_updated);
                }

                // Render Stock Ticker
                renderStocks(data.stocks || []);

                // Normalize Article Data Structure
                allArticles = data.feeds || data.articles || data.news || [];
                renderArticles();

            } catch (error) {
                console.error('Error loading dashboard:', error);
                document.getElementById('feed-grid').innerHTML = `
                    <div class="col-span-full bg-white p-6 rounded-xl border border-red-200 text-center">
                        <p class="text-red-500 font-semibold mb-1">Unable to load news feed</p>
                        <p class="text-xs text-slate-400">Please verify data.json exists and GitHub Actions run succeeded.</p>
                    </div>`;
            }
        }

        function renderStocks(stocks) {
            const stockContainer = document.getElementById('stock-container');
            if (!stocks || stocks.length === 0) {
                stockContainer.innerHTML = `<span class="text-slate-500">Market data unavailable</span>`;
                return;
            }

            stockContainer.innerHTML = stocks.map(stock => {
                // Safely extract price
                const price = stock.price !== undefined ? Number(stock.price).toFixed(2) : '0.00';
                
                // Safely extract percentage change from all possible key variations
                let changeVal = 0.0;
                if (stock.change_percent !== undefined) changeVal = stock.change_percent;
                else if (stock.changePercent !== undefined) changeVal = stock.changePercent;
                else if (stock.change !== undefined) changeVal = stock.change;

                changeVal = Number(changeVal) || 0.0;
                const isPositive = changeVal >= 0;
                const arrow = isPositive ? '▲' : '▼';
                const colorClass = isPositive ? 'text-emerald-400' : 'text-rose-400';
                const currencySymbol = stock.currency === 'INR' ? '₹' : (stock.currency === 'USD' ? '$' : '');

                return `
                    <div class="inline-flex items-center gap-1.5 px-3 py-1 bg-slate-800 rounded-md shrink-0">
                        <span class="text-slate-300 font-medium">${stock.name}</span>
                        <span class="text-white font-bold">${currencySymbol}${price}</span>
                        <span class="${colorClass} text-[11px] font-semibold">${arrow} ${Math.abs(changeVal).toFixed(2)}%</span>
                    </div>
                `;
            }).join('');
        }

        function filterCategory(categoryName) {
            currentActiveCategory = categoryName;

            // Update Active Pill UI Style
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.innerText.trim() === categoryName) {
                    btn.className = 'filter-btn active bg-blue-600 text-white px-4 py-2 rounded-full text-xs font-semibold shrink-0 shadow-sm transition';
                } else {
                    btn.className = 'filter-btn bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 px-4 py-2 rounded-full text-xs font-semibold shrink-0 transition';
                }
            });

            renderArticles();
        }

        function renderArticles() {
            const grid = document.getElementById('feed-grid');

            // Filter logic matching both category and tag
            const filtered = allArticles.filter(art => {
                if (currentActiveCategory === 'All Feeds') return true;
                const artCat = (art.category || art.tag || '').toLowerCase().trim();
                const targetCat = currentActiveCategory.toLowerCase().trim();
                return artCat === targetCat;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full bg-white p-8 rounded-xl border border-slate-200 text-center">
                        <p class="text-slate-500 font-medium">No articles found in this section.</p>
                        <p class="text-xs text-slate-400 mt-1">Select another tab or check back after the next scheduled update.</p>
                    </div>`;
                return;
            }

            grid.innerHTML = filtered.map(item => `
                <article class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between gap-2 mb-3">
                            <span class="inline-block bg-blue-50 text-blue-700 font-bold text-[10px] uppercase tracking-wider px-2.5 py-1 rounded-md">
                                ${item.category || item.tag || 'General'}
                            </span>
                            <span class="text-xs text-slate-400 font-medium">${item.date || 'Today'}</span>
                        </div>
                        <h2 class="text-base font-bold text-slate-900 mb-2 leading-snug hover:text-blue-600 transition">
                            <a href="${item.link || '#'}" target="_blank" rel="noopener noreferrer">${item.title}</a>
                        </h2>
                        <p class="text-xs text-slate-600 leading-relaxed mb-4">
                            ${item.summary || item.description || ''}
                        </p>
                    </div>
                    <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
                        <a href="${item.link || '#'}" target="_blank" rel="noopener noreferrer" class="text-xs font-bold text-blue-600 hover:text-blue-800 flex items-center gap-1 transition">
                            Read Article &rarr;
                        </a>
                    </div>
                </article>
            `).join('');
        }

        // Initialize Dashboard on Load
        document.addEventListener('DOMContentLoaded', loadDashboardData);
    </script>
</body>
</html>
